name: Publish

# Publishes the package to npmjs when main carries a version the registry does not have.
#
# A release is a version bump in package.json, so that file is the trigger; a push that leaves
# the version alone is skipped after the guard, and a push that changes nothing here starts no
# run at all. The workflow runs only over code already merged to main, which is why it may hold
# the publishing secret where CI may not.
#
# Needs one repository secret: NPM_TOKEN, a granular npmjs access token for the xema scope with
# write access to packages and 2FA bypass enabled for automation.
on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: read

# The newest main supersedes an older attempt rather than queueing behind it.
concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    name: Publish to npmjs
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 15
    permissions:
      # The release, and the tag it creates, on the commit that was published.
      contents: write
      # Provenance: npm records which workflow built the tarball, signed with the run's OIDC token.
      id-token: write
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      # registry-url makes setup-node write an .npmrc that reads the token from NODE_AUTH_TOKEN,
      # which is set on the publish step only.
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Never published untested, whatever CI said about the pull request.
      - name: Test
        run: pnpm test

      # Asks the registry for every version it holds and looks for this one. Asking for the one
      # version directly would not do: `npm view name@x.y.z version` exits 0 and prints nothing
      # when the version is absent, which reads as "published" to a shell test. A 404 means the
      # package has never been published; any other failure is a failed question, not an answer,
      # and stops the run rather than being read as "not yet".
      - name: Decide whether this version is already published
        id: version
        run: |
          node - <<'JS' >> "$GITHUB_OUTPUT"
          const { name, version } = require("./package.json");
          const { spawnSync } = require("node:child_process");
          const view = spawnSync("npm", ["view", name, "versions", "--json"], { encoding: "utf8" });
          let versions = [];
          if (view.status === 0) {
            const parsed = JSON.parse(view.stdout.trim() || "[]");
            versions = Array.isArray(parsed) ? parsed : [parsed];
          } else if (!/E404/.test(`${view.stdout}${view.stderr}`)) {
            console.error(view.stderr || view.stdout);
            process.exit(1);
          }
          const published = versions.includes(version);
          console.error(`${name}@${version}: ${published ? "already on the registry" : `not published (registry has ${versions.length} version${versions.length === 1 ? "" : "s"})`}`);
          console.log(`name=${name}`);
          console.log(`version=${version}`);
          console.log(`published=${published}`);
          JS

      # --no-git-checks: pnpm would otherwise insist on a clean tree on a release branch. The
      # workflow is that check -- it runs on main, at one commit, after install, build and test.
      - name: Publish
        if: steps.version.outputs.published == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: pnpm publish --access public --no-git-checks

      # Creating the release creates the tag on this commit; no git push and no gh binary,
      # which a self-hosted runner may not have.
      - name: Create the GitHub release
        if: steps.version.outputs.published == 'false'
        uses: actions/github-script@v7
        env:
          NAME: ${{ steps.version.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const { NAME, VERSION } = process.env;
            const tag = `v${VERSION}`;
            const existing = await github.rest.repos.getReleaseByTag({ ...context.repo, tag }).catch(error => {
              if (error.status === 404) return undefined;
              throw error;
            });
            if (existing) {
              core.info(`${tag} already exists: ${existing.data.html_url}`);
              return;
            }
            const release = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `${NAME}@${VERSION}`,
              body: `https://www.npmjs.com/package/${NAME}/v/${VERSION}`,
              generate_release_notes: true,
            });
            core.info(`Created ${release.data.html_url}`);

      - name: Nothing to publish
        if: steps.version.outputs.published == 'true'
        run: echo "${{ steps.version.outputs.name }}@${{ steps.version.outputs.version }} is already on the registry; bump the version in package.json to release."
