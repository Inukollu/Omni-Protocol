name: Publish

# Publishes every non-workflow merge to main. An explicitly changed unpublished version wins;
# otherwise the workflow increments the patch version until it finds one npm has not published.
# It records that version back on main before publishing it.
#
# npmjs trusts this workflow through GitHub's OIDC identity, so publishing needs no long-lived
# registry token. The package's Trusted Publisher settings must name Inukollu/Omni-Protocol and
# the workflow filename publish.yml.
on:
  push:
    branches: [main]
    paths-ignore:
      - .github/**
      # The README is read on GitHub, not from the package; guide.md ships in the tarball and does publish.
      - README.md
  workflow_dispatch:

permissions:
  contents: read

# The newest main supersedes an older attempt rather than queueing behind it.
concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    name: Publish to npmjs
    # npm trusted publishing currently requires a GitHub-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # The release, and the tag it creates, on the commit that was published.
      contents: write
      # Provenance: npm records which workflow built the tarball, signed with the run's OIDC token.
      id-token: write
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          # Trusted publishing requires Node >=22.14 and npm >=11.5.1.
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Never published untested, whatever CI said about the pull request.
      - name: Test
        run: pnpm test

      # Keep an intentionally selected unpublished version (for example, a minor bump). When the
      # source version already exists, allocate the next free patch version. Query failures other
      # than a genuine first-publish 404 stop the release.
      - name: Allocate the release version
        id: version
        run: |
          node - <<'JS' >> "$GITHUB_OUTPUT"
          const fs = require("node:fs");
          const { spawnSync } = require("node:child_process");
          const manifest = require("./package.json");
          const { name } = manifest;
          const view = spawnSync("npm", ["view", name, "versions", "--json"], { encoding: "utf8" });
          let versions = [];
          if (view.status === 0) {
            const parsed = JSON.parse(view.stdout.trim() || "[]");
            versions = Array.isArray(parsed) ? parsed : [parsed];
          } else if (!/E404/.test(`${view.stdout}${view.stderr}`)) {
            console.error(view.stderr || view.stdout);
            process.exit(1);
          }

          const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(manifest.version);
          if (!match) throw new Error(`Automatic releases require a stable semver version; got ${manifest.version}`);
          let version = manifest.version;
          while (versions.includes(version)) {
            version = `${match[1]}.${match[2]}.${Number(version.split(".")[2]) + 1}`;
          }
          manifest.version = version;
          fs.writeFileSync("package.json", `${JSON.stringify(manifest, null, 2)}\n`);
          console.error(`${name}@${version}: allocated from ${versions.length} published version${versions.length === 1 ? "" : "s"}`);
          console.log(`name=${name}`);
          console.log(`version=${version}`);
          JS

      # A GITHUB_TOKEN-authored commit does not start another workflow run, so recording the
      # allocated version cannot recurse into a second release.
      - name: Record the release version on main
        id: commit
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const fs = require("node:fs");
            const current = await github.rest.repos.getContent({
              ...context.repo,
              path: "package.json",
              ref: context.sha,
            });
            const updated = await github.rest.repos.createOrUpdateFileContents({
              ...context.repo,
              path: "package.json",
              branch: context.ref.replace("refs/heads/", ""),
              message: `Bump package version to ${process.env.VERSION}`,
              content: fs.readFileSync("package.json", "base64"),
              sha: current.data.sha,
            });
            core.setOutput("sha", updated.data.commit.sha);

      - name: Publish
        # npm exchanges GitHub's OIDC identity for a short-lived registry credential and adds
        # provenance automatically. Do not add NODE_AUTH_TOKEN to this step.
        run: npm publish --access public

      # Creating the release creates the tag on this commit; no git push and no gh binary,
      # which a self-hosted runner may not have.
      - name: Create the GitHub release
        uses: actions/github-script@v7
        env:
          NAME: ${{ steps.version.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const { NAME, VERSION } = process.env;
            const tag = `v${VERSION}`;
            const existing = await github.rest.repos.getReleaseByTag({ ...context.repo, tag }).catch(error => {
              if (error.status === 404) return undefined;
              throw error;
            });
            if (existing) {
              core.info(`${tag} already exists: ${existing.data.html_url}`);
              return;
            }
            const release = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tag,
              target_commitish: "${{ steps.commit.outputs.sha }}",
              name: `${NAME}@${VERSION}`,
              body: `https://www.npmjs.com/package/${NAME}/v/${VERSION}`,
              generate_release_notes: true,
            });
            core.info(`Created ${release.data.html_url}`);
