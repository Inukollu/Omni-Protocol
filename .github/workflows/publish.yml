name: Publish

# Publishes each merge to main, allocating the next unpublished version and recording it back.
# npmjs trusts this workflow through OIDC: Trusted Publisher is Inukollu/Omni-Protocol, publish.yml.
on:
  push:
    branches: [main]
    paths-ignore:
      - .github/**
      - README.md
  workflow_dispatch:

permissions:
  contents: read

# Runs queue rather than cancel: a cancel can land after npm has published and before the version
# is recorded, and two merges seconds apart would both allocate the same version.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npmjs
    # npm trusted publishing currently requires a GitHub-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          # Trusted publishing requires Node >=22.14 and npm >=11.5.1.
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Allocate the release version
        id: version
        run: |
          node - <<'JS' >> "$GITHUB_OUTPUT"
          const fs = require("node:fs");
          const { spawnSync } = require("node:child_process");
          const manifest = require("./package.json");
          const { name } = manifest;
          const view = spawnSync("npm", ["view", name, "versions", "--json"], { encoding: "utf8" });
          let versions = [];
          if (view.status === 0) {
            const parsed = JSON.parse(view.stdout.trim() || "[]");
            versions = Array.isArray(parsed) ? parsed : [parsed];
          } else if (!/E404/.test(`${view.stdout}${view.stderr}`)) {
            console.error(view.stderr || view.stdout);
            process.exit(1);
          }

          // The registry lists a version minutes after it is staged, and a run queued behind another
          // reads it before then: two merges a minute apart both allocated 0.1.75, and the second
          // failed with E409 at publish. The branch head records a version the moment it is
          // allocated, so what the head says is taken too, whether or not npm lists it yet.
          const fetched = spawnSync("git", ["fetch", "--quiet", "--depth=1", "origin", "main"], { encoding: "utf8" });
          if (fetched.status !== 0) { console.error(fetched.stderr); process.exit(1); }
          const head = spawnSync("git", ["show", "origin/main:package.json"], { encoding: "utf8" });
          if (head.status !== 0) { console.error(head.stderr); process.exit(1); }
          const recorded = JSON.parse(head.stdout).version;
          if (!versions.includes(recorded)) versions.push(recorded);

          const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(manifest.version);
          if (!match) throw new Error(`Automatic releases require a stable semver version; got ${manifest.version}`);
          let version = manifest.version;
          while (versions.includes(version)) {
            version = `${match[1]}.${match[2]}.${Number(version.split(".")[2]) + 1}`;
          }
          manifest.version = version;
          fs.writeFileSync("package.json", `${JSON.stringify(manifest, null, 2)}\n`);
          console.error(`${name}@${version}: allocated past ${versions.length} taken version${versions.length === 1 ? "" : "s"}, the branch head's ${recorded} among them`);
          console.log(`name=${name}`);
          console.log(`version=${version}`);
          JS

      # A GITHUB_TOKEN-authored commit starts no workflow run, so this cannot recurse. The sha the
      # update is conditioned on is read from the branch head, not from the commit that started the
      # run: a run queued behind another finds the branch already bumped by it, and a 409 says the
      # head moved between the read and the write, so the read is repeated once.
      - name: Record the release version on main
        id: commit
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const fs = require("node:fs");
            const branch = context.ref.replace("refs/heads/", "");
            const record = async () => {
              const current = await github.rest.repos.getContent({ ...context.repo, path: "package.json", ref: branch });
              return github.rest.repos.createOrUpdateFileContents({
                ...context.repo,
                path: "package.json",
                branch,
                message: `Bump package version to ${process.env.VERSION}`,
                content: fs.readFileSync("package.json", "base64"),
                sha: current.data.sha,
              });
            };
            let updated;
            try {
              updated = await record();
            } catch (error) {
              if (error.status !== 409) throw error;
              core.warning("package.json moved on the branch between the read and the write; reading it again");
              updated = await record();
            }
            core.setOutput("sha", updated.data.commit.sha);

      - name: Publish
        # OIDC becomes a short-lived registry credential with provenance; no NODE_AUTH_TOKEN here.
        run: npm publish --access public

      - name: Create the GitHub release
        uses: actions/github-script@v7
        env:
          NAME: ${{ steps.version.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const { NAME, VERSION } = process.env;
            const tag = `v${VERSION}`;
            const existing = await github.rest.repos.getReleaseByTag({ ...context.repo, tag }).catch(error => {
              if (error.status === 404) return undefined;
              throw error;
            });
            if (existing) {
              core.info(`${tag} already exists: ${existing.data.html_url}`);
              return;
            }
            const release = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tag,
              target_commitish: "${{ steps.commit.outputs.sha }}",
              name: `${NAME}@${VERSION}`,
              body: `https://www.npmjs.com/package/${NAME}/v/${VERSION}`,
              generate_release_notes: true,
            });
            core.info(`Created ${release.data.html_url}`);
