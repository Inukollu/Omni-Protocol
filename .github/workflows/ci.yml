name: CI

# Validates a pull request. pull_request_target rather than pull_request because workflows from
# fork pull requests are disabled at the organisation level, and every change arrives from a
# fork; the trigger is the fix, not the setting. The job checks out the untrusted merge ref, so
# it holds no secrets and only read permissions. Publishing lives in publish.yml, over code that
# is already on main.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and test
    if: github.event_name != 'pull_request_target' || !github.event.pull_request.draft
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      # The merge ref, not the head: what CI reports on is what main is about to become.
      - name: Check out the pull request merge
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request_target' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      # The version comes from package.json's packageManager field, so the action and the
      # repository cannot disagree about which pnpm this is.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # What would be published, so a file missing from `files` is caught here and not on npm.
      - name: Show the package contents
        run: pnpm pack --dry-run
