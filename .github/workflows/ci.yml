name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    # The self-hosted pool when CI_RUNNER names it, as the sibling repositories do; hosted when it is
    # unset. A switch, not a failover: if the named pool is down, jobs queue. Name the pool as
    # '["self-hosted","Linux"]', never bare self-hosted, which also matches macOS and Windows machines.
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - name: Check out the pull request merge
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          # pnpm 11 needs Node >=22.13; its bundled runtime keeps Node 20 testable.
          standalone: true
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the test runtime
        env:
          EXPECTED_NODE_MAJOR: ${{ matrix.node }}
        run: |
          pnpm exec node <<'JS'
            const actual = process.versions.node;
            if (actual.split(".")[0] !== process.env.EXPECTED_NODE_MAJOR) {
              throw new Error(`Expected Node ${process.env.EXPECTED_NODE_MAJOR}, got ${actual}`);
            }
            console.log(`Testing with Node ${actual}`);
          JS

      - name: Validate source, tests, guide, and package
        run: pnpm check
