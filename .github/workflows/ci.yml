name: CI

# Validates pull requests on a disposable GitHub-hosted runner. `pull_request` gives fork code a
# read-only token and the event's merge ref without opting into the trusted `pull_request_target`
# context. Publishing lives separately in publish.yml and runs only over code already on main.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and test
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # pull_request checks out the merge ref by default: what CI reports on is what main would
      # become, while workflow_dispatch checks out the selected ref.
      - name: Check out the pull request merge
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # What would be published, so a file missing from `files` is caught here and not on npm.
      - name: Show the package contents
        run: pnpm pack --dry-run
